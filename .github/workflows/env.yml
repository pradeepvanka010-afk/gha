name: env
on: push
env:
  TAGS: "3.0"

jobs:
  envjob:
    runs-on: ubuntu-latest
    env:
      app_env: "dev"
    steps:
      - name: print env
        run: echo "Welcome to $app_env version $TAGS"
  newjob:
    runs-on: ubuntu-latest
    env:
      app_env: "uat"
    steps:
      - name: print env
        run: echo "Welcome to $app_env version $TAGS"